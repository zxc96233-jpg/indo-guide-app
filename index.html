<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col h-screen">
    <div class="bg-blue-800 p-4 text-white shadow-lg font-bold text-center">INDO GUIDE AI</div>
    <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="bg-white p-3 rounded-lg shadow-sm text-sm border max-w-[80%] text-gray-700">مرحباً! أنا خبيرك الذكي في إندونيسيا. كيف يمكنني مساعدتك اليوم؟</div>
    </div>
    <div class="p-3 bg-white border-t flex gap-2 items-center">
        <input type="text" id="user-input" placeholder="اسألني عن جاكرتا أو العقارات..." class="flex-1 border rounded-full px-4 py-2 outline-none text-sm">
        <button onclick="ask()" class="bg-blue-700 text-white px-5 py-2 rounded-full font-bold text-sm">إرسال</button>
    </div>

    <script>
        const API_KEY = "AlzaSyA1PNjdG8qGCaR_zoOcnzJQnUeS0zW5NBE"; // مفتاحك الفعال من لقطة الشاشة

        async function ask() {
            const input = document.getElementById('user-input');
            const box = document.getElementById('chat-box');
            const msg = input.value.trim();
            if(!msg) return;

            box.innerHTML += `<div class="bg-blue-600 text-white p-3 rounded-lg self-end ml-auto max-w-[80%] text-sm">${msg}</div>`;
            input.value = "";
            box.scrollTop = box.scrollHeight;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "أنت خبير إندونيسيا INDO GUIDE. أجب باختصار وبالعربية: " + msg }] }] })
                });
                const data = await res.json();
                const reply = data.candidates[0].content.parts[0].text;
                box.innerHTML += `<div class="bg-white p-3 rounded-lg shadow-sm text-sm border max-w-[80%] text-gray-700">${reply}</div>`;
            } catch (e) {
                box.innerHTML += `<div class="text-red-500 text-xs italic text-center">عذراً، حدث خطأ في الاتصال. تأكد من الإنترنت.</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
