<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="flex flex-col h-screen bg-gray-100">
    <div class="bg-blue-800 p-4 text-white shadow-lg font-bold">INDO GUIDE AI</div>
    <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="bg-white p-3 rounded-lg shadow-sm text-sm border max-w-[80%]">مرحباً! أنا INDO GUIDE. اسألني عن أي شيء في إندونيسيا.</div>
    </div>
    <div id="load" class="hidden px-4 text-xs text-blue-600 animate-pulse">جاري الاتصال بجوجل...</div>
    <div class="p-3 bg-white border-t flex gap-2">
        <input type="text" id="user-in" placeholder="اسألني هنا..." class="flex-1 border rounded-full px-4 py-2 outline-none">
        <button onclick="ask()" class="bg-blue-700 text-white px-6 py-2 rounded-full font-bold">إرسال</button>
    </div>

    <script>
        const API_KEY = "AlzaSyA1PNjdG8qGCaR_zoOcnzJQnUeS0zW5NBE"; 

        async function ask() {
            const input = document.getElementById('user-in');
            const box = document.getElementById('chat-box');
            const load = document.getElementById('load');
            const msg = input.value.trim();
            if(!msg) return;

            box.innerHTML += `<div class="bg-blue-600 text-white p-3 rounded-lg self-end ml-auto max-w-[80%] text-sm">${msg}</div>`;
            input.value = "";
            load.classList.remove('hidden');
            box.scrollTop = box.scrollHeight;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "أنت خبير إندونيسيا INDO GUIDE. أجب باختصار: " + msg }] }] })
                });
                const data = await res.json();
                const reply = data.candidates[0].content.parts[0].text;
                box.innerHTML += `<div class="bg-white p-3 rounded-lg shadow-sm text-sm border max-w-[80%]">${reply}</div>`;
            } catch (e) {
                box.innerHTML += `<div class="text-red-500 text-xs italic">خطأ في الاتصال، يرجى المحاولة ثانية.</div>`;
            } finally {
                load.classList.add('hidden');
                box.scrollTop = box.scrollHeight;
            }
        }
    </script>
</body>
</html>
