<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Indo Guide</title>
</head>
<body>
  <h2>تجربة الاتصال مع Google Apps Script</h2>
  
  <!-- إدخال الرسالة -->
  <input type="text" id="userMessage" placeholder="اكتب رسالتك هنا">
  <button onclick="sendMessage()">إرسال</button>
  
  <!-- مكان عرض الرد -->
  <div id="replyBox" style="margin-top:20px; color:blue;"></div>

  <script>
    function sendMessage() {
      const userMessage = document.getElementById("userMessage").value;
      
      fetch("https://script.google.com/macros/s/AKfycbwVkTWI5KTZtwnkruLWL1ia3uZu5hR9EkHNosokUMihvMsHuiAMwUzcx_bVYiKst4hXCw/exec", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: userMessage })
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById("replyBox").innerText = data.reply;
      })
      .catch(error => {
        document.getElementById("replyBox").innerText = "حصل خطأ أثناء الاتصال: " + error;
      });
    }
  </script>
</body>
</html>
