<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f0f2f5; }
        .chat-area { height: calc(100vh - 140px); overflow-y: auto; padding: 15px; }
        .ai-msg { background: white; border-radius: 15px 15px 0 15px; padding: 10px; font-size: 14px; max-width: 85%; margin-bottom: 10px; border: 1px solid #ddd; }
        .user-msg { background: #1e40af; color: white; border-radius: 15px 15px 15px 0; padding: 10px; font-size: 14px; max-width: 85%; align-self: flex-end; margin-bottom: 10px; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <div class="bg-blue-800 p-4 text-white flex items-center shadow-md">
        <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center text-blue-800 font-bold ml-2">IG</div>
        <h1 class="font-bold">INDO GUIDE AI</h1>
    </div>

    <div id="chat-box" class="chat-area flex flex-col">
        <div class="ai-msg">مرحباً! أنا INDO GUIDE. تم تحديث نظام الاتصال لتخطي الحظر. اسألني أي سؤال عن إندونيسيا الآن.</div>
    </div>

    <div id="load" class="hidden px-4 text-xs text-gray-500 animate-pulse">جاري الاتصال بجوجل...</div>

    <div class="p-3 bg-white border-t flex gap-2">
        <input type="text" id="user-in" placeholder="اسأل عن جاكرتا أو العقارات.." class="flex-1 border rounded-full px-4 py-2 text-sm outline-none border-gray-300">
        <button onclick="talk()" class="bg-blue-700 text-white px-5 py-2 rounded-full text-sm font-bold">إرسال</button>
    </div>

    <script>
        const API_KEY = "AlzaSyA1PNjdG8qGCaR_zoOcnzJQnUeS0zW5NBE";

        async function talk() {
            const input = document.getElementById('user-in');
            const box = document.getElementById('chat-box');
            const load = document.getElementById('load');
            const msg = input.value.trim();

            if(!msg) return;

            box.innerHTML += `<div class="user-msg">${msg}</div>`;
            input.value = "";
            load.classList.remove('hidden');
            box.scrollTop = box.scrollHeight;

            try {
                // استخدمنا هنا رابط مباشر مع باراميترز لضمان الوصول
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
                
                const res = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "أنت خبير إندونيسيا INDO GUIDE. أجب باختصار باللغة العربية: " + msg }] }]
                    })
                });

                const data = await res.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    box.innerHTML += `<div class="ai-msg">${reply}</div>`;
                } else {
                    throw new Error();
                }
            } catch (e) {
                box.innerHTML += `<div class="ai-msg text-red-600 font-bold italic">عذراً، تطبيق Mobeasy لا يزال يحظر الاتصال المباشر. يرجى تجربة فتح الصفحة في المتصفح الخارجي.</div>`;
            } finally {
                load.classList.add('hidden');
                box.scrollTop = box.scrollHeight;
            }
        }
    </script>
</body>
</html>
