<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f3f4f6; }
        .chat-box { height: calc(100vh - 140px); overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div class="bg-blue-800 p-4 text-white shadow-md flex items-center justify-between">
        <span class="font-bold">INDO GUIDE AI</span>
        <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
    </div>

    <div id="chat-content" class="chat-box">
        <div class="bg-white p-3 rounded-lg shadow-sm border max-w-[85%] text-sm">أهلاً بك في INDO GUIDE! أنا جاهز لمساعدتك في كل ما يخص السياحة والعقارات في إندونيسيا. اسألني أي شيء..</div>
    </div>

    <div id="status" class="hidden px-4 text-xs text-gray-500 italic">جاري معالجة طلبك...</div>

    <div class="p-4 bg-white border-t flex gap-2">
        <input type="text" id="user-input" placeholder="اكتب سؤالك هنا.." class="flex-1 border rounded-full px-4 py-2 outline-none focus:ring-2 focus:ring-blue-600 text-sm">
        <button onclick="askGemini()" class="bg-blue-700 text-white px-5 py-2 rounded-full font-bold text-sm">إرسال</button>
    </div>

    <script>
        // مفتاح الـ API الخاص بك
        const KEY = "AlzaSyA1PNjdG8qGCaR_zoOcnzJQnUeS0zW5NBE"; 

        async function askGemini() {
            const input = document.getElementById('user-input');
            const chat = document.getElementById('chat-content');
            const status = document.getElementById('status');
            const prompt = input.value.trim();

            if(!prompt) return;

            // إضافة رسالة المستخدم
            chat.innerHTML += `<div class="bg-blue-600 text-white p-3 rounded-lg self-end max-w-[85%] text-sm">${prompt}</div>`;
            input.value = "";
            status.classList.remove('hidden');
            chat.scrollTop = chat.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "أنت INDO GUIDE خبير إندونيسيا. أجب باختصار وبالعربية: " + prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    const aiText = data.candidates[0].content.parts[0].text;
                    chat.innerHTML += `<div class="bg-white p-3 rounded-lg shadow-sm border max-w-[85%] text-sm">${aiText}</div>`;
                } else {
                    // إذا كان المفتاح به مشكلة أو محظور جغرافياً
                    console.error(data);
                    throw new Error();
                }
            } catch (error) {
                chat.innerHTML += `<div class="bg-red-50 text-red-600 p-2 rounded text-xs border border-red-200">حدث خطأ في النظام. يرجى المحاولة بعد قليل أو التأكد من تفعيل المفتاح.</div>`;
            } finally {
                status.classList.add('hidden');
                chat.scrollTop = chat.scrollHeight;
            }
        }
    </script>
</body>
</html>
