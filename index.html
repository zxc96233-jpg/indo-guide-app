<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: sans-serif; }
        .msg-box { height: calc(100vh - 120px); overflow-y: auto; padding: 20px; }
    </style>
</head>
<body class="flex flex-col h-screen">
    <div class="bg-blue-700 text-white p-4 font-bold text-center shadow">INDO GUIDE AI</div>
    <div id="chat" class="msg-box flex flex-col gap-4">
        <div class="bg-white p-3 rounded-lg shadow-sm border max-w-[80%]">مرحباً! أنا خبيرك في إندونيسيا. كيف أساعدك اليوم؟</div>
    </div>
    <div class="p-3 bg-white border-t flex gap-2">
        <input type="text" id="userInput" placeholder="اسألني عن جاكرتا أو العقارات.." class="flex-1 border rounded-full px-4 py-2 outline-none">
        <button onclick="sendMessage()" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold">إرسال</button>
    </div>

    <script>
        // ضع مفتاحك هنا بدقة
        const API_KEY = "AlzaSyA1PNjdG8qGCaR_zoOcnzJQnUeS0zW5NBE"; 

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const text = input.value.trim();
            if (!text) return;

            chat.innerHTML += `<div class="bg-blue-500 text-white p-3 rounded-lg self-end max-w-[80%]">${text}</div>`;
            input.value = "";
            chat.scrollTop = chat.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "أنت خبير سياحة وعقارات في إندونيسيا. أجب باختصار باللغة العربية: " + text }] }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    chat.innerHTML += `<div class="bg-white p-3 rounded-lg shadow-sm border max-w-[80%]">${reply}</div>`;
                } else {
                    throw new Error();
                }
            } catch (error) {
                chat.innerHTML += `<div class="text-red-500 text-center text-xs italic">حدث خطأ في الاتصال. تأكد من إعدادات الـ API.</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
